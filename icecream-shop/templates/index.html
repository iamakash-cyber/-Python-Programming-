<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ice Cream Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff5f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d63384;
            font-size: 40px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .search-box {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .flavor-count {
            color: #d63384;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .shop {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .icecream {
            background-color: white;
            width: 200px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s;
        }

        .icecream:hover {
            transform: translateY(-8px);
        }

        .emoji {
            font-size: 60px;
        }

        .icecream h2 {
            color: #333;
            margin: 10px 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
        }

        input[type="text"] {
            padding: 10px;
            margin: 5px;
            width: 160px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #b02a6b;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            color: #777;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <h1>🍦 Welcome to My Ice Cream Shop 🍦</h1>

    <p class="subtitle">
        Choose your favorite flavor and enjoy your sweet treat!
    </p>

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="🔍 Search ice cream..."
        onkeyup="searchIceCream()"
    >

    <p class="flavor-count">
        Available Flavors: {{ icecreams|length }}
    </p>

    <div class="shop" id="icecreamShop">

        {% for icecream in icecreams %}

        <div class="icecream" data-name="{{ icecream.name }}">

            <div class="emoji">
                {{ icecream.emoji }}
            </div>

            <h2>{{ icecream.name }}</h2>

            <p class="price">
                ₹{{ icecream.price }}
            </p>

            <form action="/order" method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required
                >

                <input
                    type="hidden"
                    name="flavor"
                    value="{{ icecream.name }}"
                >

                <br><br>

                <button type="submit">
                    Order Now 🍦
                </button>

            </form>

        </div>

        {% endfor %}

    </div>

    <footer>
        🍨 Made with love | My Ice Cream Shop 🍦
    </footer>


    <script>
        function searchIceCream() {
            let input = document.getElementById("searchInput");
            let filter = input.value.toLowerCase();

            let cards = document.getElementsByClassName("icecream");

            for (let i = 0; i < cards.length; i++) {

                let name = cards[i].getAttribute("data-name").toLowerCase();

                if (name.includes(filter)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
